<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Minhas Plantas 🌿</title>
  
  <meta name="theme-color" content="#3a5335" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f6f4ee;
      --moss: #3a5335;
      --sage: #6b8e63;
      --mist: #dbe4d8;
      --terra: #c16e41;
      --gold: #b38b4d;
      --ink: #1c241b;
      --white: #ffffff;
      --red-alert: #d9534f;
      --shadow: 0 8px 24px rgba(28, 36, 27, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .app-layout {
      display: flex;
      flex: 1;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .sidebar {
      width: 280px;
      background: var(--moss);
      color: var(--white);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.85rem 1rem;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.95rem;
      font-weight: 500;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .nav-btn:hover, .nav-btn.active {
      background: rgba(255, 255, 255, 0.15);
      color: var(--white);
    }

    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--white);
      border-top: 1px solid var(--mist);
      padding: 0.6rem 1rem env(safe-area-inset-bottom);
      z-index: 100;
      justify-content: space-around;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.05);
    }

    .bottom-nav .nav-btn {
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.7rem;
      color: var(--ink);
      opacity: 0.6;
      padding: 0.4rem;
      align-items: center;
    }

    .bottom-nav .nav-btn.active {
      background: transparent;
      opacity: 1;
      color: var(--moss);
      font-weight: 700;
    }

    .main-content {
      flex: 1;
      padding: 2rem;
      padding-bottom: 6rem;
      max-width: 1100px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header-title h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--moss);
    }

    .header-title p {
      font-size: 0.88rem;
      color: var(--gold);
    }

    .btn-primary {
      background: var(--terra);
      color: var(--white);
      border: none;
      padding: 0.75rem 1.4rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 12px rgba(193, 110, 65, 0.3);
      transition: transform 0.2s, background 0.2s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      background: #b05f34;
    }

    .species-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .species-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .species-info {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .species-emoji {
      font-size: 2.2rem;
      background: var(--cream);
      padding: 0.5rem;
      border-radius: 12px;
      line-height: 1;
    }

    .species-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--ink);
    }

    .species-subtitle {
      font-size: 0.75rem;
      color: var(--sage);
      font-style: italic;
    }

    .pet-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 50px;
      margin-top: 0.4rem;
    }

    .pet-badge.toxic {
      background: #fde8e8;
      color: var(--red-alert);
    }

    .pet-badge.safe {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(28, 36, 27, 0.4);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      background: var(--white);
      width: 100%;
      max-width: 500px;
      height: 100%;
      padding: 2rem;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .modal-overlay.active .drawer {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--mist);
      padding-bottom: 1rem;
    }

    .btn-close {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--ink);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--moss);
      text-transform: uppercase;
    }

    .form-control {
      padding: 0.8rem 1rem;
      border: 1.5px solid var(--mist);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    .btn-ai-autofill {
      background: linear-gradient(135deg, #6b8e63 0%, #3a5335 100%);
      color: white;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.3rem;
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .bottom-nav { display: flex; }
      .main-content { padding: 1.25rem; padding-bottom: 5.5rem; }
      .modal-overlay { align-items: flex-end; }
      .drawer {
        max-width: 100%;
        height: 88vh;
        border-radius: 20px 20px 0 0;
        transform: translateY(100%);
      }
      .modal-overlay.active .drawer { transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand">
        <span style="font-size: 1.8rem;">🌿</span>
        <h1>Minhas Plantas</h1>
      </div>
      <nav class="nav-links">
        <button class="nav-btn active" onclick="switchTab('plants')">🌱 Minhas Espécies</button>
        <button class="nav-btn" onclick="switchTab('ai')">🤖 Diagnóstico IA</button>
      </nav>
    </aside>

    <main class="main-content">
      <section id="sec-plants">
        <div class="header-bar">
          <div class="header-title">
            <h2>Coleção de Plantas</h2>
            <p>☁️ Powered by Cloudflare Workers & Gemini</p>
          </div>
          <button class="btn-primary" onclick="openDrawer('drawerAddSpecies')">
            <span>+</span> Nova Planta
          </button>
        </div>

        <div class="species-grid" id="speciesList"></div>
      </section>

      <section id="sec-ai" style="display: none;">
        <div class="header-bar">
          <div class="header-title">
            <h2>Análise de Saúde com IA 🩺</h2>
            <p>Envie uma foto da sua planta para diagnóstico</p>
          </div>
        </div>

        <div style="background: white; padding: 1.5rem; border-radius: var(--radius); box-shadow: var(--shadow);">
          <div class="form-group">
            <label>Foto da Planta</label>
            <input type="file" id="aiImageInput" accept="image/*" class="form-control" />
          </div>
          <button class="btn-primary" style="width: 100%; justify-content: center;" onclick="runAIDiagnosis()">
            🔍 Analisar Saúde com IA
          </button>

          <div id="aiResult" style="margin-top: 1.5rem; display: none; padding: 1.2rem; background: var(--cream); border-radius: 12px; line-height: 1.6;"></div>
        </div>
      </section>
    </main>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('plants')">
      <span style="font-size: 1.2rem;">🌱</span>
      Plantas
    </button>
    <button class="nav-btn" onclick="switchTab('ai')">
      <span style="font-size: 1.2rem;">🤖</span>
      IA Saúde
    </button>
  </nav>

  <div class="modal-overlay" id="drawerAddSpecies">
    <div class="drawer">
      <div class="drawer-header">
        <h3 style="font-family: 'Playfair Display', serif; color: var(--moss);">Cadastrar Espécie</h3>
        <button class="btn-close" onclick="closeActiveDrawer()">&times;</button>
      </div>

      <form id="formSpecies" onsubmit="saveSpecies(event)">
        <div class="form-group">
          <label>Nome Popular</label>
          <input type="text" id="specieName" class="form-control" placeholder="Ex: Jiboia, Monstera..." required />
          <button type="button" class="btn-ai-autofill" onclick="autoFillWithAI()">
            ✨ Preencher Cuidados com IA
          </button>
        </div>

        <div class="form-group">
          <label>Nome Científico</label>
          <input type="text" id="specieScientific" class="form-control" placeholder="Epipremnum aureum" />
        </div>

        <div class="form-group">
          <label>Frequência de Regas (Dias)</label>
          <input type="number" id="specieWaterDays" class="form-control" placeholder="5" />
        </div>

        <div class="form-group">
          <label>Cuidados & Solo</label>
          <textarea id="specieCare" class="form-control" rows="3" placeholder="Solo drenável, luz indireta..."></textarea>
        </div>

        <div class="form-group">
          <label>Segurança para Pets</label>
          <select id="speciePetSafety" class="form-control">
            <option value="unknown">Não informado</option>
            <option value="safe">✅ Segura para cães e gatos</option>
            <option value="toxic">⚠️ Tóxica para Pets</option>
          </select>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
          Salvar Planta
        </button>
      </form>
    </div>
  </div>

  <script>
    // URL do seu Cloudflare Worker
    const WORKER_URL = "https://shiny-sky-21dd.genesisgns.workers.dev/";

    let speciesData = [
      {
        id: "1",
        name: "Jiboia",
        scientific: "Epipremnum aureum",
        emoji: "🌿",
        waterDays: 5,
        petSafety: "toxic"
      }
    ];

    window.addEventListener('popstate', () => {
      const activeOverlay = document.querySelector('.modal-overlay.active');
      if (activeOverlay) {
        activeOverlay.classList.remove('active');
      }
    });

    function openDrawer(drawerId) {
      const drawer = document.getElementById(drawerId);
      if (drawer) {
        drawer.classList.add('active');
        history.pushState({ modalOpen: true }, '');
      }
    }

    function closeActiveDrawer() {
      const activeOverlay = document.querySelector('.modal-overlay.active');
      if (activeOverlay) {
        activeOverlay.classList.remove('active');
        if (history.state && history.state.modalOpen) {
          history.back();
        }
      }
    }

    function switchTab(tab) {
      document.getElementById('sec-plants').style.display = tab === 'plants' ? 'block' : 'none';
      document.getElementById('sec-ai').style.display = tab === 'ai' ? 'block' : 'none';
      
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      event.currentTarget.classList.add('active');
    }

    function renderSpecies() {
      const container = document.getElementById('speciesList');
      container.innerHTML = '';

      speciesData.forEach(item => {
        const petTag = item.petSafety === 'toxic' 
          ? `<span class="pet-badge toxic">⚠️ Tóxica para Pets</span>`
          : item.petSafety === 'safe'
          ? `<span class="pet-badge safe">✅ Segura para Pets</span>`
          : '';

        const card = document.createElement('div');
        card.className = 'species-card';
        card.innerHTML = `
          <div class="card-header">
            <div class="species-info">
              <span class="species-emoji">${item.emoji || '🌿'}</span>
              <div>
                <div class="species-title">${item.name}</div>
                <div class="species-subtitle">${item.scientific || ''}</div>
                ${petTag}
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Preenchimento de Dicas via IA no Worker
    async function autoFillWithAI() {
      const name = document.getElementById('specieName').value;
      if (!name) return alert('Digite o nome da planta primeiro!');

      const btn = document.querySelector('.btn-ai-autofill');
      btn.innerText = "⏳ Consultando Gemini...";
      btn.disabled = true;

      const prompt = `
      Você é um botânico especialista. Forneça dados de cultivo sobre a planta '${name}'.
      Responda EXCLUSIVAMENTE em formato JSON VÁLIDO sem markdown:
      {
          "scientific_name": "Nome científico exato",
          "water_days": 5,
          "soil": "Recomendação de solo e rega",
          "pet_toxic": true
      }
      `;

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: prompt })
        });

        const data = await response.json();

        if (response.ok && data.resposta) {
          const cleanedText = data.resposta.replace(/```json/g, '').replace(/```/g, '').trim();
          const parsed = JSON.parse(cleanedText);

          document.getElementById('specieScientific').value = parsed.scientific_name || '';
          document.getElementById('specieWaterDays').value = parsed.water_days || 5;
          document.getElementById('specieCare').value = parsed.soil || '';
          document.getElementById('speciePetSafety').value = parsed.pet_toxic ? 'toxic' : 'safe';
        } else {
          alert('Erro: ' + (data.error || 'Falha na resposta'));
        }
      } catch (err) {
        alert("Erro de comunicação com o Cloudflare Worker.");
      } finally {
        btn.innerText = "✨ Preencher Cuidados com IA";
        btn.disabled = false;
      }
    }

    // Helper para converter imagem para Base64
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => {
          const base64String = reader.result.split(',')[1];
          resolve(base64String);
        };
        reader.onerror = error => reject(error);
      });
    }

    // Diagnóstico por Foto via IA no Worker
    async function runAIDiagnosis() {
      const fileInput = document.getElementById('aiImageInput');
      const resultDiv = document.getElementById('aiResult');

      if (!fileInput.files[0]) {
        return alert("Por favor, selecione uma foto!");
      }

      const file = fileInput.files[0];
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = "⏳ <b>Analisando a foto da planta via Cloudflare Worker... Aguarde.</b>";

      try {
        const base64 = await fileToBase64(file);
        const prompt = "Você é um agrônomo especialista em saúde foliar. Analise visualmente a foto desta planta, aponte problemas de rega, luz ou pragas e forneça um plano de cuidado em tópicos simples.";

        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: prompt,
            imageBase64: base64,
            mimeType: file.type
          })
        });

        const data = await response.json();

        if (response.ok && data.resposta) {
          resultDiv.innerHTML = `
            <h4>🩺 Relatório de Saúde:</h4>
            <div style="white-space: pre-line; margin-top: 0.8rem;">${data.resposta}</div>
          `;
        } else {
          resultDiv.innerHTML = `❌ Erro na análise: ${data.error || 'Falha ao processar'}`;
        }
      } catch (err) {
        resultDiv.innerHTML = "❌ Não foi possível realizar a análise no momento.";
      }
    }

    function saveSpecies(e) {
      e.preventDefault();
      const newSpecies = {
        id: Date.now().toString(),
        name: document.getElementById('specieName').value,
        scientific: document.getElementById('specieScientific').value,
        emoji: "🪴",
        waterDays: document.getElementById('specieWaterDays').value,
        petSafety: document.getElementById('speciePetSafety').value
      };

      speciesData.unshift(newSpecies);
      renderSpecies();
      closeActiveDrawer();
      document.getElementById('formSpecies').reset();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderSpecies();
    });
  </script>
</body>
</html>
