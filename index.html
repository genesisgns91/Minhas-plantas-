<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Minhas Plantas 🌿</title>
<meta name="description" content="Cuide das suas plantas: regas, adubação, poda, lembretes e fotos por espécie.">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a6741">
<meta name="background-color" content="#f5f0e8">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minhas Plantas">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root{--ink:#1a1a14;--cream:#f5f0e8;--sage:#7a9e7e;--moss:#4a6741;--terra:#c17a4a;--mist:#d4e0d2;--gold:#b8965a;--red:#c0392b;--blue:#6ba3be}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  
  #syncBar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--sage);z-index:999;transform:scaleX(0);transform-origin:left;transition:transform .4s}
  #syncBar.active{transform:scaleX(1)}
  #onlineStatus{position:fixed;top:8px;right:12px;font-size:.65rem;font-weight:500;padding:.2rem .7rem;border-radius:50px;z-index:998}
  #onlineStatus.online{background:#d4f0d4;color:#2e7d32}
  #onlineStatus.offline{background:#fce8e8;color:var(--red)}

  header{padding:2.5rem 1.5rem 1.5rem;display:flex;flex-direction:column;align-items:center;text-align:center}
  .leaf-deco{font-size:2.5rem;margin-bottom:.5rem;opacity:.6;animation:sway 4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3rem);font-weight:700;color:var(--moss)}
  .subtitle{font-size:.8rem;font-weight:300;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-top:.4rem}

  .controls{padding:1rem 1.5rem;display:flex;flex-direction:column;gap:.8rem;max-width:900px;margin:0 auto}
  .search-row{display:flex;gap:.6rem;align-items:center}
  .search-wrap{position:relative;flex:1}
  .search-wrap input{width:100%;padding:.75rem 1rem .75rem 2.5rem;border:1.5px solid var(--mist);border-radius:50px;background:white;font-size:.9rem;outline:none}
  .search-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);opacity:.4}
  
  .btn-add{padding:.65rem 1.1rem;border-radius:50px;border:none;background:var(--terra);color:white;font-size:.82rem;font-weight:500;cursor:pointer}
  
  .species-groups{display:flex;flex-direction:column;gap:1.4rem;padding:1rem 1.5rem 3rem;max-width:900px;margin:0 auto}
  .species-group{background:white;border-radius:18px;border:1.5px solid var(--mist);overflow:hidden}
  .species-header{display:flex;align-items:center;gap:.8rem;padding:.75rem 1.2rem;cursor:pointer;position:relative}
  .species-name{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--ink)}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(26,26,20,.5);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:flex-end;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .25s}
  .modal-overlay.open{opacity:1;pointer-events:all}
  .modal{background:var(--cream);border-radius:20px;padding:1.5rem;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
  
  /* Botões e Inputs */
  .camera-btn-group{display:flex;gap:.5rem;margin-top:.5rem}
  .btn-cam{flex:1;padding:.6rem;border-radius:10px;border:1.5px solid var(--sage);background:white;color:var(--moss);font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.4rem}
</style>
</head>
<body>

<div id="syncBar"></div>
<div id="onlineStatus" class="online">● Conectado</div>

<header>
  <div class="leaf-deco">🌿</div>
  <h1>Minhas Plantas</h1>
  <div class="subtitle">Sincronizado com Firebase</div>
</header>

<main class="controls">
  <div class="search-row">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Buscar espécies ou vasos..." oninput="renderPlants()">
    </div>
    <button class="btn-add" onclick="openAddModal()">+ Nova Planta</button>
  </div>
</main>

<div id="plantContainer" class="species-groups"></div>

<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleImageCaptured(event)">
<input type="file" id="galleryInput" accept="image/*" style="display:none" onchange="handleImageCaptured(event)">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // SUAS CONFIGURAÇÕES DO FIREBASE (substitua com suas chaves reais):
  const firebaseConfig = {
    apiKey: "Sua_API_Key",
    authDomain: "seu-projeto.firebaseapp.com",
    projectId: "seu-projeto-id",
    storageBucket: "seu-projeto.appspot.com",
    messagingSenderId: "000000000000",
    appId: "1:000000000000:web:000000000000"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.plantData = [];

  // Sincronização em tempo real do Firebase
  const syncFirebase = () => {
    const syncBar = document.getElementById('syncBar');
    syncBar.classList.add('active');

    onSnapshot(collection(db, "plantas"), (snapshot) => {
      window.plantData = [];
      snapshot.forEach((docSnap) => {
        window.plantData.push({ id: docSnap.id, ...docSnap.data() });
      });
      // Salva cópia local
      localStorage.setItem('my_plants_backup', JSON.stringify(window.plantData));
      renderPlants();
      syncBar.classList.remove('active');
    }, (error) => {
      console.warn("Erro de conexão Firebase, usando dados locais:", error);
      const local = localStorage.getItem('my_plants_backup');
      if (local) window.plantData = JSON.parse(local);
      renderPlants();
      syncBar.classList.remove('active');
    });
  };

  // Salvar no Firebase
  window.savePlantToFirebase = async (plantObject) => {
    try {
      const docRef = doc(db, "plantas", plantObject.id || String(Date.now()));
      await setDoc(docRef, plantObject, { merge: true });
    } catch (e) {
      console.error("Erro ao salvar no Firestore:", e);
    }
  };

  // Excluir do Firebase
  window.deletePlantFromFirebase = async (plantId) => {
    try {
      await deleteDoc(doc(db, "plantas", plantId));
    } catch (e) {
      console.error("Erro ao excluir do Firestore:", e);
    }
  };

  window.addEventListener('DOMContentLoaded', syncFirebase);
</script>

<script>
  function renderPlants() {
    const container = document.getElementById('plantContainer');
    const search = document.getElementById('searchInput').value.toLowerCase();
    
    if (!window.plantData || window.plantData.length === 0) {
      container.innerHTML = '<div class="empty">Nenhuma planta cadastrada ainda.</div>';
      return;
    }

    const filtered = window.plantData.filter(p => 
      (p.name && p.name.toLowerCase().includes(search)) || 
      (p.species && p.species.toLowerCase().includes(search))
    );

    container.innerHTML = filtered.map(p => `
      <div class="species-group">
        <div class="species-header">
          <span style="font-size:1.8rem">${p.emoji || '🌿'}</span>
          <div>
            <div class="species-name">${p.name || 'Sem Nome'}</div>
            <div style="font-size:0.75rem; color:#666">${p.species || 'Espécie não informada'}</div>
          </div>
        </div>
      </div>
    `).join('');
  }

  // Acionar captura de imagem via Câmera ou Galeria
  window.triggerCamera = function() {
    document.getElementById('cameraInput').click();
  };

  window.triggerGallery = function() {
    document.getElementById('galleryInput').click();
  };

  window.handleImageCaptured = function(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Image = e.target.result;
        alert("Imagem carregada com sucesso! Enviando para análise de IA...");
        // Adicionar chamada do seu modelo de IA enviando o base64Image
      };
      reader.readAsDataURL(file);
    }
  };

  function openAddModal() {
    const name = prompt("Nome da Planta:");
    const species = prompt("Espécie:");
    if (name) {
      const newPlant = {
        id: "plant_" + Date.now(),
        name: name,
        species: species || "",
        emoji: "🌿",
        createdAt: new Date().toISOString()
      };
      if (window.savePlantToFirebase) {
        window.savePlantToFirebase(newPlant);
      }
    }
  }
</script>

</body>
</html>
